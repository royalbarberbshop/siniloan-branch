name: Build and deploy Royal Barber Shop to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Build static site
        env:
          VITE_LIVE_SUPABASE_URL: ${{ vars.VITE_LIVE_SUPABASE_URL || vars.VITE_SUPABASE_URL }}
          VITE_LIVE_SUPABASE_ANON_KEY: ${{ vars.VITE_LIVE_SUPABASE_ANON_KEY || vars.VITE_SUPABASE_ANON_KEY }}
          VITE_DEMO_SUPABASE_URL: ${{ vars.VITE_DEMO_SUPABASE_URL }}
          VITE_DEMO_SUPABASE_ANON_KEY: ${{ vars.VITE_DEMO_SUPABASE_ANON_KEY }}
        run: npm run build
      - name: Add SPA fallback for customer and admin routes
        run: cp dist/index.html dist/404.html
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload built site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
